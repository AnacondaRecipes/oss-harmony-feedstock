{% set name = "oss-harmony" %}
{% set version = "0.0.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: ccad467b71d61490df1f2204b7a064990833338615ac135536c5b3a8e2d03a15
build:
  skip: true  # [py<310]
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

  host:
    - python
    - maturin >=1.8,<2.0
    - pip
    - zstd {{ zstd }}

  run:
    - python
    - pydantic >=2.11.7

  run_constrained:
    # Both openai-harmony and oss-harmony provide the openai_harmony python package, and cannot both be loaded
    # into the same environment.
    - openai-harmony <=0.0.0a0

test:
  source_files:
    - tests/
    - test-data/
  imports:
    - openai_harmony
  requires:
    - pytest
    - abi3audit
    - pip
  commands:
    - pip check
    - pytest tests
    - export SP_DIR=$(python -c "import site; print(site.getsitepackages()[0])") # [unix]
    - abi3audit $SP_DIR/openai_harmony/openai_harmony.abi3.so -s -v --assume-minimum-abi3 {{ python }} # [unix]
    - set "SP_DIR=%PREFIX%\\Lib\\site-packages" # [win]
    - abi3audit %SP_DIR%\\openai_harmony\\openai_harmony.pyd -s -v --assume-minimum-abi3 {{ python }} # [win]


about:
  home: https://pypi.org/project/oss-harmony/
  summary: OpenAI's response format for its open-weight model series gpt-oss
  description: |
    The gpt-oss models were trained on the harmony response format for
    defining conversation structures, generating reasoning output and
    structuring function calls. If you are not using gpt-oss directly
    but through an API or a provider like HuggingFace, Ollama, or vLLM,
    you will not have to be concerned about this as your inference solution
    will handle the formatting. If you are building your own inference
    solution, this guide will walk you through the prompt format. The
    format is designed to mimic the OpenAI Responses API, so if you have
    used that API before, this format should hopefully feel familiar to
    you. gpt-oss should not be used without using the harmony format as it
    will not work correctly.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
    # zstd-sys compiles in pre-generated bindings (src/bindings_zstd*.rs) that are BSD-3-Clause.
    # cargo-bundle-licenses only records the crate's declared MIT/Apache-2.0, so ship the notice
    # (crate-root LICENSE.BSD-3-Clause of zstd-sys 2.0.16+zstd.1.5.7) explicitly.
    - licenses/LICENSE-zstd-sys-bindings.BSD-3-Clause
  license_family: Apache
  doc_url: https://github.com/oss-harmony/harmony/tree/main/docs
  dev_url: https://github.com/oss-harmony/harmony

extra:
  recipe-maintainers:
    - shermansiu
